<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .developer-info {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 30px 0;
        }

        .student-list-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .student-list {
            border: 1px solid #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .student-list-header {
            background-color: #f8f9fa;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 2fr 3fr 1fr;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        .student-item {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 2fr 3fr 1fr;
            border-bottom: 1px solid #eee;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .empty-message {
            padding: 30px;
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }

        .delete-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Student Information System</h1>
        <div class="developer-info">Developed By: 101483006 || Maddox Duggan || DevOps</div>
    </header>

    <section class="form-section">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter student name">
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter student age">
        </div>

        <div class="form-group">
            <label for="major">Major:</label>
            <input type="text" id="major" placeholder="Enter student major">
        </div>

        <button id="addStudentBtn">Add Student</button>
    </section>

    <hr>

    <section class="student-list-section">
        <h2>Student List</h2>
        <div class="student-list" id="studentList">
            <div class="empty-message">No students added yet</div>
        </div>
    </section>
</div>

<script src="../src/index.js"></script>
</body>
</html>
